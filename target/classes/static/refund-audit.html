<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>退款审核 - 后台管理</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container{max-width:1200px;margin:0 auto;padding:24px}
        .filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
        .filter-bar select{padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--border-radius-sm);font-size:14px}
        .refund-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:var(--border-radius-sm);overflow:hidden}
        .refund-table th{background:var(--bg-secondary);padding:12px 14px;text-align:left;font-weight:600;font-size:13px;color:var(--text-secondary);border-bottom:2px solid var(--border-color)}
        .refund-table td{padding:10px 14px;border-bottom:1px solid var(--border-light);font-size:13px}
        .refund-table tr:hover td{background:var(--primary-light)}
        .status-PENDING{background:#fef3c7;color:#92400e}
        .status-APPROVED{background:#dcfce7;color:#166534}
        .status-REJECTED{background:#fee2e2;color:#991b1b}
        .status-COMPLETED{background:#e0e7ff;color:#3730a3}
        .status-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
        .pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px}
        .pagination button{padding:6px 14px;border:1px solid var(--border-color);border-radius:var(--border-radius-sm);background:var(--white);cursor:pointer}
        .pagination button.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
        .pagination button:disabled{opacity:.5;cursor:not-allowed}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}
        .modal-box{background:var(--white);border-radius:var(--border-radius);padding:24px;width:420px;max-width:90vw}
        .modal-box h3{margin:0 0 16px}
        .modal-box textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border-color);border-radius:var(--border-radius-sm);font-size:14px;resize:vertical;margin-bottom:12px}
        .modal-box .btn-row{display:flex;gap:8px;justify-content:flex-end}
    </style>
</head>
<body>
<div id="app">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">🎫 后台管理</div>
            <div class="nav-links">
                <a href="admin-home.html" class="nav-link">管理首页</a>
                <a href="refund-audit.html" class="nav-link active">退款审核</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="admin-container">
            <h2 style="margin-bottom:20px">💰 退款审核</h2>
            <div class="filter-bar">
                <select id="statusFilter" onchange="searchRefunds()">
                    <option value="">全部状态</option>
                    <option value="PENDING">待审核</option>
                    <option value="APPROVED">已通过</option>
                    <option value="REJECTED">已拒绝</option>
                </select>
                <button class="btn btn-primary" onclick="searchRefunds()">查询</button>
            </div>
            <div id="refundTableContainer"><div class="loading">加载中...</div></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </main>
</div>

<div id="auditModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
        <h3 id="auditModalTitle">审核退款</h3>
        <div id="auditInfo" style="margin-bottom:12px;font-size:14px;color:var(--text-muted)"></div>
        <textarea id="auditRemarkInput" placeholder="审核备注..."></textarea>
        <div class="btn-row">
            <button class="btn btn-secondary" onclick="closeAuditModal()">取消</button>
            <button class="btn btn-outline" style="color:var(--error-color);border-color:var(--error-color)" onclick="submitAudit('REJECTED')">拒绝</button>
            <button class="btn btn-primary" onclick="submitAudit('APPROVED')">通过</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    var currentPage = 1;
    var pageSize = 15;
    var currentRefundId = null;

    async function loadRefunds() {
        var container = document.getElementById('refundTableContainer');
        container.innerHTML = '<div class="loading">加载中...</div>';
        var status = document.getElementById('statusFilter').value;

        try {
            var res = await api.refunds.getPage(currentPage, pageSize, status);
            if (res.code === 200) {
                renderTable(res.data);
            } else {
                container.innerHTML = '<p style="text-align:center;color:var(--error-color)">' + (res.message || '加载失败') + '</p>';
            }
        } catch (e) {
            container.innerHTML = '<p style="text-align:center;color:var(--error-color)">加载失败</p>';
        }
    }

    function renderTable(pageData) {
        var records = pageData.records || [];
        if (records.length === 0) {
            document.getElementById('refundTableContainer').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">暂无退款记录</div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        var html = '<table class="refund-table"><thead><tr>' +
            '<th>退款单号</th><th>订单号</th><th>用户ID</th><th>退款金额</th><th>退款原因</th><th>类型</th><th>状态</th><th>申请时间</th><th>操作</th>' +
            '</tr></thead><tbody>';

        records.forEach(function(r) {
            var statusMap = { 'PENDING': '待审核', 'APPROVED': '已通过', 'REJECTED': '已拒绝', 'COMPLETED': '已完成' };
            var typeMap = { 'ORDER_CANCEL': '取消订单', 'SESSION_CHANGE': '演出变更', 'DUPLICATE_ORDER': '重复下单', 'OTHER': '其他' };
            var time = r.createTime ? r.createTime.replace('T', ' ').substring(0, 19) : '-';

            html += '<tr>';
            html += '<td>' + r.refundNo + '</td>';
            html += '<td>' + r.orderId + '</td>';
            html += '<td>' + r.userId + '</td>';
            html += '<td style="color:var(--error-color);font-weight:600">¥' + r.refundAmount + '</td>';
            html += '<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + (r.refundReason || '') + '">' + (r.refundReason || '-') + '</td>';
            html += '<td>' + (typeMap[r.refundType] || r.refundType || '-') + '</td>';
            html += '<td><span class="status-badge status-' + r.status + '">' + (statusMap[r.status] || r.status) + '</span></td>';
            html += '<td>' + time + '</td>';
            html += '<td>';
            if (r.status === 'PENDING') {
                html += '<button class="btn btn-primary" style="font-size:12px;padding:4px 10px" onclick="showAuditModal(' + r.id + ', \'' + r.refundNo + '\', \'¥' + r.refundAmount + '\')">审核</button>';
            } else {
                html += '<span style="color:var(--text-muted);font-size:12px">已处理</span>';
            }
            html += '</td></tr>';
        });

        html += '</tbody></table>';
        document.getElementById('refundTableContainer').innerHTML = html;
        renderPagination(pageData);
    }

    function renderPagination(pageData) {
        var totalPages = pageData.pages || 1;
        var container = document.getElementById('pagination');
        if (totalPages <= 1) { container.innerHTML = ''; return; }

        var html = '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="goPage(' + (currentPage - 1) + ')">上一页</button>';
        var start = Math.max(1, currentPage - 2);
        var end = Math.min(totalPages, currentPage + 2);
        for (var i = start; i <= end; i++) {
            html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
        }
        html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="goPage(' + (currentPage + 1) + ')">下一页</button>';
        container.innerHTML = html;
    }

    function goPage(page) { currentPage = page; loadRefunds(); }
    function searchRefunds() { currentPage = 1; loadRefunds(); }

    function showAuditModal(id, refundNo, amount) {
        currentRefundId = id;
        document.getElementById('auditInfo').textContent = '退款单号: ' + refundNo + ' | 金额: ' + amount;
        document.getElementById('auditRemarkInput').value = '';
        document.getElementById('auditModal').style.display = 'flex';
    }

    function closeAuditModal() { document.getElementById('auditModal').style.display = 'none'; }

    async function submitAudit(status) {
        var remark = document.getElementById('auditRemarkInput').value.trim();
        try {
            var res = await api.refunds.audit(currentRefundId, status, remark);
            if (res.code === 200) {
                closeAuditModal();
                alert(status === 'APPROVED' ? '退款已通过' : '退款已拒绝');
                loadRefunds();
            } else {
                alert(res.message || '操作失败');
            }
        } catch (e) { alert('操作失败'); }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var token = localStorage.getItem('token');
        if (!token) { window.location.href = 'login.html'; return; }
        loadRefunds();
    });
</script>
</body>
</html>
