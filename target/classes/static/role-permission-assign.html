<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 分配权限</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .page-header-section {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);
            padding: 36px 40px;
            border-radius: var(--border-radius-lg);
            margin-bottom: 32px;
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .page-header-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .page-header-section h1 {
            margin: 0;
            color: white;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        .page-header-section h1::before {
            content: '🔐';
            font-size: 36px;
        }

        .btn-back {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 12px 24px;
            border-radius: var(--border-radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .list-section {
            background: var(--white);
            padding: 0;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .section-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '📋';
        }

        .select-all {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 32px 0;
            padding: 16px 20px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: var(--border-radius);
            border: 1px solid #fcd34d;
        }

        .select-all input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .select-all span {
            font-weight: 600;
            color: #92400e;
            font-size: 14px;
        }

        .permission-groups {
            padding: 24px 32px;
        }

        .permission-group {
            margin-bottom: 32px;
        }

        .permission-group:last-child {
            margin-bottom: 0;
        }

        .group-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .group-title::before {
            content: '📁';
        }

        .permission-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .permission-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border-light);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .permission-item:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        .permission-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
            flex-shrink: 0;
        }

        .permission-info {
            flex: 1;
            min-width: 0;
        }

        .permission-name {
            font-weight: 600;
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 2px;
        }

        .permission-code {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'SF Mono', 'Courier New', monospace;
        }

        .save-section {
            padding: 24px 32px;
            border-top: 1px solid var(--border-light);
            background: var(--bg-secondary);
            text-align: center;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 14px 48px;
            border-radius: var(--border-radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .admin-container {
                padding: 16px;
            }

            .page-header-section {
                padding: 24px;
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .permission-groups {
                padding: 16px;
            }

            .select-all {
                margin: 16px 16px 0;
            }

            .permission-list {
                grid-template-columns: 1fr;
            }

            .save-section {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">🎫 后台管理</div>
                <div class="nav-links">
                    <a href="admin-home.html" class="nav-link">演唱会管理</a>
                    <a href="admin.html" class="nav-link">添加/编辑演唱会</a>
                    <a href="faq-admin.html" class="nav-link">FAQ 管理</a>
                    <a href="token-usage.html" class="nav-link">Token 用量</a>
                    <a href="role-manage.html" class="nav-link">角色管理</a>
                    <a href="permission-manage.html" class="nav-link">权限管理</a>
                    <a href="user-role-assign.html" class="nav-link">用户角色</a>
                    <a href="role-permission-assign.html" class="nav-link active">角色权限</a>
                    <a href="user-info.html" class="nav-link">👤 个人信息</a>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="admin-container">
                <div class="page-header-section">
                    <h1>分配权限 - <span id="roleNameDisplay"></span></h1>
                    <button class="btn-back" onclick="window.location.href='role-manage.html'">← 返回角色管理</button>
                </div>

                <div class="list-section">
                    <div class="section-header">
                        <div class="section-title">权限列表</div>
                    </div>
                    <div class="select-all">
                        <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                        <span>全选 / 取消全选</span>
                    </div>
                    <div class="permission-groups" id="permissionGroups"></div>
                    <div class="save-section">
                        <button class="btn-save" onclick="savePermissions()">保存权限</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roleId = urlParams.get('roleId');
        const roleName = urlParams.get('roleName');
        let allPermissions = [];
        let selectedPermissions = new Set();

        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json'
            };
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }
            return headers;
        }

        document.getElementById('roleNameDisplay').textContent = decodeURIComponent(roleName);

        async function init() {
            await loadAllPermissions();
            await loadRolePermissions();
            renderPermissions();
        }

        async function loadAllPermissions() {
            try {
                const res = await fetch('/api/v1/admin/permission/list', {
                    method: 'GET',
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (data.code === 200) {
                    allPermissions = data.data;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loadRolePermissions() {
            try {
                const res = await fetch(`/api/v1/admin/permission/role/${roleId}`, {
                    method: 'GET',
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (data.code === 200) {
                    selectedPermissions = new Set(data.data.map(p => p.id));
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderPermissions() {
            const grouped = {};
            allPermissions.forEach(p => {
                const module = p.module || '其他';
                if (!grouped[module]) {
                    grouped[module] = [];
                }
                grouped[module].push(p);
            });

            const container = document.getElementById('permissionGroups');
            container.innerHTML = '';
            for (const [module, perms] of Object.entries(grouped)) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'permission-group';
                groupDiv.innerHTML = `
                    <div class="group-title">${escapeHtml(module)}</div>
                    <div class="permission-list">
                        ${perms.map(p => `
                            <label class="permission-item">
                                <input type="checkbox" id="perm_${p.id}" value="${p.id}"
                                    ${selectedPermissions.has(p.id) ? 'checked' : ''}
                                    onchange="togglePermission(${p.id}, this.checked)">
                                <div class="permission-info">
                                    <div class="permission-name">${escapeHtml(p.permissionName)}</div>
                                    <div class="permission-code">${escapeHtml(p.permissionCode)}</div>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(groupDiv);
            }
        }

        function togglePermission(id, checked) {
            if (checked) {
                selectedPermissions.add(id);
            } else {
                selectedPermissions.delete(id);
            }
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll').checked;
            if (selectAll) {
                allPermissions.forEach(p => selectedPermissions.add(p.id));
            } else {
                selectedPermissions.clear();
            }
            renderPermissions();
        }

        async function savePermissions() {
            try {
                const res = await fetch('/api/v1/admin/role-permission/assign', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        roleId: parseInt(roleId),
                        permissionIds: Array.from(selectedPermissions)
                    })
                });
                const data = await res.json();
                if (data.code === 200) {
                    alert('权限保存成功！');
                    window.location.href = 'role-manage.html';
                }
            } catch (e) {
                console.error(e);
                alert('保存失败');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        init();
    </script>
    <script src="js/auth-check.js"></script>
    <script src="js/user-info.js"></script>
</body>
</html>
