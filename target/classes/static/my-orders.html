<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 演唱会票务系统</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .orders-container{max-width:1000px;margin:0 auto;padding:24px}
        .order-list-item{background:var(--white);border-radius:var(--border-radius);box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden;transition:var(--transition-fast)}
        .order-list-item:hover{box-shadow:var(--shadow-md)}
        .order-item-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--bg-secondary);border-bottom:1px solid var(--border-light)}
        .order-item-header .order-id{font-size:13px;color:var(--text-muted)}
        .order-item-body{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
        .order-info h3{margin:0 0 8px;font-size:16px}
        .order-info .meta{font-size:13px;color:var(--text-muted);display:flex;gap:16px;flex-wrap:wrap}
        .order-price{font-size:22px;font-weight:700;color:var(--error-color)}
        .order-actions{display:flex;gap:8px;flex-shrink:0}
        .status-badge{display:inline-block;padding:4px 14px;border-radius:16px;font-size:13px;font-weight:500}
        .status-PENDING_PAYMENT{background:#fef3c7;color:#92400e}
        .status-PAID{background:#dcfce7;color:#166534}
        .status-CANCELLED{background:#fee2e2;color:#991b1b}
        .status-REFUNDED{background:#e0e7ff;color:#3730a3}
        .status-REFUNDING{background:#dbeafe;color:#1e40af}
        .filter-bar{display:flex;gap:12px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
        .filter-bar select,.filter-bar input{padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--border-radius-sm);font-size:14px}
        .pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px}
        .pagination button{padding:6px 14px;border:1px solid var(--border-color);border-radius:var(--border-radius-sm);background:var(--white);cursor:pointer}
        .pagination button.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
        .pagination button:disabled{opacity:.5;cursor:not-allowed}
        .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
        .empty-state .icon{font-size:48px;margin-bottom:16px}
    </style>
</head>
<body>
<div id="app">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">🎫 票务系统</div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="user-center.html" class="nav-link">用户中心</a>
                <a href="my-orders.html" class="nav-link active">我的订单</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="orders-container">
            <h2 style="margin-bottom:20px">📋 我的订单</h2>
            <div class="filter-bar">
                <select id="statusFilter" onchange="searchOrders()">
                    <option value="">全部状态</option>
                    <option value="PENDING_PAYMENT">待支付</option>
                    <option value="PAID">已支付</option>
                    <option value="CANCELLED">已取消</option>
                    <option value="REFUNDED">已退款</option>
                    <option value="REFUNDING">退款中</option>
                </select>
                <input type="text" id="keywordInput" placeholder="搜索订单号/演出名称..." onkeyup="if(event.key==='Enter')searchOrders()">
                <button class="btn btn-primary" onclick="searchOrders()">搜索</button>
            </div>
            <div id="orderList"><div class="loading">加载中...</div></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script>
    var currentPage = 1;
    var pageSize = 10;
    var currentUser = null;

    function getStatusText(status) {
        var map = {
            'PENDING_PAYMENT': '待支付', 'PAID': '已支付', 'CANCELLED': '已取消',
            'REFUNDED': '已退款', 'REFUNDING': '退款中', 'PAYMENT_FAILED': '支付失败'
        };
        return map[status] || status;
    }

    async function loadOrders() {
        if (!currentUser) return;
        var container = document.getElementById('orderList');
        container.innerHTML = '<div class="loading">加载中...</div>';

        var keyword = document.getElementById('keywordInput').value.trim();
        try {
            var res = await api.orders.getPage(currentUser.id, currentPage, pageSize, keyword);
            if (res.code === 200) {
                renderOrders(res.data);
            } else {
                container.innerHTML = '<div class="empty-state"><div class="icon">😔</div><p>' + (res.message || '加载失败') + '</p></div>';
            }
        } catch (e) {
            container.innerHTML = '<div class="empty-state"><div class="icon">😔</div><p>加载失败</p></div>';
        }
    }

    function renderOrders(pageData) {
        var records = pageData.records || [];
        var container = document.getElementById('orderList');

        var statusFilter = document.getElementById('statusFilter').value;
        if (statusFilter) {
            records = records.filter(function(o) { return o.orderStatus === statusFilter; });
        }

        if (records.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无订单</p></div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        var html = '';
        records.forEach(function(order) {
            html += '<div class="order-list-item">';
            html += '<div class="order-item-header">';
            html += '<span class="order-id">订单号: ' + order.orderId + '</span>';
            html += '<span class="status-badge status-' + order.orderStatus + '">' + getStatusText(order.orderStatus) + '</span>';
            html += '</div>';
            html += '<div class="order-item-body">';
            html += '<div class="order-info">';
            html += '<h3>' + (order.activityName || '演出') + '</h3>';
            html += '<div class="meta">';
            html += '<span>📅 ' + (order.sessionDate || '-') + ' ' + (order.sessionTime || '') + '</span>';
            html += '<span>📍 ' + (order.venue || '-') + '</span>';
            html += '<span>💺 ' + (order.seatInfo || '-') + '</span>';
            html += '</div></div>';
            html += '<div style="text-align:right">';
            html += '<div class="order-price">¥' + (order.totalPrice || 0) + '</div>';
            html += '<div class="order-actions">';
            html += '<a href="order-detail.html?id=' + order.orderId + '" class="btn btn-outline" style="font-size:13px">查看详情</a>';
            if (order.orderStatus === 'PENDING_PAYMENT') {
                html += '<button class="btn btn-primary" style="font-size:13px" onclick="quickPay(\'' + order.orderId + '\')">支付</button>';
            }
            html += '</div></div>';
            html += '</div></div>';
        });

        container.innerHTML = html;
        renderPagination(pageData);
    }

    function renderPagination(pageData) {
        var totalPages = pageData.pages || 1;
        var container = document.getElementById('pagination');
        if (totalPages <= 1) { container.innerHTML = ''; return; }

        var html = '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="goPage(' + (currentPage - 1) + ')">上一页</button>';
        var start = Math.max(1, currentPage - 2);
        var end = Math.min(totalPages, currentPage + 2);
        for (var i = start; i <= end; i++) {
            html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
        }
        html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="goPage(' + (currentPage + 1) + ')">下一页</button>';
        container.innerHTML = html;
    }

    function goPage(page) { currentPage = page; loadOrders(); }
    function searchOrders() { currentPage = 1; loadOrders(); }

    async function quickPay(orderId) {
        var method = prompt('请输入支付方式（ALIPAY/WECHAT/BANK_CARD）:', 'ALIPAY');
        if (!method) return;
        try {
            var res = await api.orders.pay(orderId, method);
            if (res.code === 200) { alert('支付成功！'); loadOrders(); }
            else alert(res.message || '支付失败');
        } catch (e) { alert('支付失败'); }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var token = localStorage.getItem('token');
        if (!token) { window.location.href = 'index.html'; return; }
        try {
            var userStr = localStorage.getItem('user');
            if (userStr) {
                currentUser = JSON.parse(userStr);
                loadOrders();
            }
        } catch (e) {}
    });
</script>
</body>
</html>
