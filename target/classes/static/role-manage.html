<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 角色管理</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .page-header-section {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);
            padding: 36px 40px;
            border-radius: var(--border-radius-lg);
            margin-bottom: 32px;
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .page-header-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .page-header-section h1 {
            margin: 0;
            color: white;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        .page-header-section h1::before {
            content: '👥';
            font-size: 36px;
        }

        .btn-add {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 12px 24px;
            border-radius: var(--border-radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        .btn-add:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .list-section {
            background: var(--white);
            padding: 0;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .section-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '📋';
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 16px 24px;
            text-align: left;
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-color);
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--bg-secondary);
        }

        tr {
            transition: var(--transition-fast);
        }

        .role-code {
            font-family: 'SF Mono', 'Courier New', monospace;
            background: var(--bg-secondary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--primary-color);
            font-weight: 600;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-active::before {
            background: #166534;
        }

        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-inactive::before {
            background: #991b1b;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 8px 14px;
            border-radius: var(--border-radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-edit {
            background: #dbeafe;
            color: #1e40af;
        }

        .btn-edit:hover {
            background: #bfdbfe;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .btn-delete:hover {
            background: #fecaca;
            transform: translateY(-1px);
        }

        .btn-perm {
            background: #fef3c7;
            color: #92400e;
        }

        .btn-perm:hover {
            background: #fde68a;
            transform: translateY(-1px);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: var(--border-radius-lg);
            padding: 0;
            max-width: 560px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-light);
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--bg-secondary);
            color: var(--text-color);
        }

        .modal-body {
            padding: 28px 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            font-size: 15px;
            transition: all 0.3s ease;
            background: var(--bg-secondary);
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            font-size: 15px;
            background: var(--bg-secondary);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding: 20px 32px;
            border-top: 1px solid var(--border-light);
            background: var(--bg-secondary);
        }

        .btn-cancel {
            padding: 10px 24px;
            border: 2px solid var(--border-color);
            background: var(--white);
            color: var(--text-secondary);
            border-radius: var(--border-radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .btn-cancel:hover {
            background: var(--bg-secondary);
        }

        .btn-submit {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: var(--border-radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .admin-container {
                padding: 16px;
            }

            .page-header-section {
                padding: 24px;
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .section-header {
                padding: 16px 20px;
            }

            th, td {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">🎫 后台管理</div>
                <div class="nav-links">
                    <a href="admin-home.html" class="nav-link">演唱会管理</a>
                    <a href="admin.html" class="nav-link">添加/编辑演唱会</a>
                    <a href="faq-admin.html" class="nav-link">FAQ 管理</a>
                    <a href="token-usage.html" class="nav-link">Token 用量</a>
                    <a href="role-manage.html" class="nav-link active">角色管理</a>
                    <a href="permission-manage.html" class="nav-link">权限管理</a>
                    <a href="user-role-assign.html" class="nav-link">用户角色</a>
                    <a href="role-permission-assign.html" class="nav-link">角色权限</a>
                    <a href="user-info.html" class="nav-link">👤 个人信息</a>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="admin-container">
                <div class="page-header-section">
                    <h1>角色管理</h1>
                    <button class="btn-add perm-role-add" onclick="openModal()" style="display: none;">
                        ➕ 添加角色
                    </button>
                </div>

                <div class="list-section">
                    <div class="section-header">
                        <div class="section-title">角色列表</div>
                    </div>
                    <div class="table-container">
                        <table id="roleTable">
                            <thead>
                                <tr>
                                    <th>角色编码</th>
                                    <th>角色名称</th>
                                    <th>描述</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="roleTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="roleModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">添加角色</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="roleForm">
                    <input type="hidden" id="roleId">
                    <div class="form-group">
                        <label>角色编码</label>
                        <input type="text" class="form-input" id="roleCode" required placeholder="如 ADMIN、OPERATOR">
                    </div>
                    <div class="form-group">
                        <label>角色名称</label>
                        <input type="text" class="form-input" id="roleName" required placeholder="如 管理员、运营人员">
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea class="form-input form-textarea" id="description" placeholder="角色描述信息"></textarea>
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select class="form-select" id="status">
                            <option value="1">启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                <button type="submit" class="btn-submit" onclick="document.getElementById('roleForm').dispatchEvent(new Event('submit'))">保存</button>
            </div>
        </div>
    </div>

    <script>
        let roles = [];

        async function loadRoles() {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json'
            };
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }

            try {
                const res = await fetch('/api/v1/admin/role/list', {
                    method: 'GET',
                    headers: headers
                });
                const data = await res.json();
                if (data.code === 200) {
                    roles = data.data;
                    renderRoles();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderRoles() {
            const tbody = document.getElementById('roleTableBody');
            if (!roles || roles.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <p>暂无角色数据</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            tbody.innerHTML = '';
            roles.forEach(role => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="role-code">${escapeHtml(role.roleCode)}</span></td>
                    <td><strong>${escapeHtml(role.roleName)}</strong></td>
                    <td>${escapeHtml(role.description || '-')}</td>
                    <td><span class="status-badge ${role.status === 1 ? 'status-active' : 'status-inactive'}">${role.status === 1 ? '启用' : '禁用'}</span></td>
                    <td>${escapeHtml(role.createTime)}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-small btn-perm perm-role-assign" onclick="openPermissionModal(${role.id}, '${escapeHtml(role.roleName)}')" style="display: none;">分配权限</button>
                            <button class="btn-small btn-edit perm-role-edit" onclick="openModal(${role.id})" style="display: none;">编辑</button>
                            <button class="btn-small btn-delete perm-role-delete" onclick="deleteRole(${role.id})" style="display: none;">删除</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            if (typeof applyPermissionControls === 'function') applyPermissionControls();
        }

        function openModal(roleId = null) {
            document.getElementById('modalTitle').textContent = roleId ? '编辑角色' : '添加角色';
            document.getElementById('roleForm').reset();
            document.getElementById('roleId').value = roleId || '';
            if (roleId) {
                const role = roles.find(r => r.id === roleId);
                if (role) {
                    document.getElementById('roleCode').value = role.roleCode;
                    document.getElementById('roleName').value = role.roleName;
                    document.getElementById('description').value = role.description || '';
                    document.getElementById('status').value = role.status;
                }
            }
            document.getElementById('roleModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('roleModal').classList.remove('active');
        }

        document.getElementById('roleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roleId = document.getElementById('roleId').value;
            const role = {
                roleCode: document.getElementById('roleCode').value,
                roleName: document.getElementById('roleName').value,
                description: document.getElementById('description').value,
                status: parseInt(document.getElementById('status').value)
            };
            if (roleId) {
                role.id = parseInt(roleId);
            }
            try {
                const url = roleId ? '/api/v1/admin/role/update' : '/api/v1/admin/role/save';
                const method = roleId ? 'PUT' : 'POST';

                const token = localStorage.getItem('token');
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }

                const res = await fetch(url, {
                    method: method,
                    headers: headers,
                    body: JSON.stringify(role)
                });
                const data = await res.json();
                if (data.code === 200) {
                    closeModal();
                    loadRoles();
                }
            } catch (e) {
                console.error(e);
            }
        });

        async function deleteRole(id) {
            if (confirm('确定要删除这个角色吗？')) {
                const token = localStorage.getItem('token');
                const headers = {};
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }

                try {
                    const res = await fetch(`/api/v1/admin/role/delete/${id}`, {
                        method: 'DELETE',
                        headers: headers
                    });
                    const data = await res.json();
                    if (data.code === 200) {
                        loadRoles();
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function openPermissionModal(roleId, roleName) {
            window.location.href = `role-permission-assign.html?roleId=${roleId}&roleName=${encodeURIComponent(roleName)}`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadRoles();

        document.addEventListener('permissionsLoaded', function() {
            if (typeof applyPermissionControls === 'function') applyPermissionControls();
        });
    </script>
    <script src="js/auth-check.js"></script>
    <script src="js/user-info.js"></script>
</body>
</html>
