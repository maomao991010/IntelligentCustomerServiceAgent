<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - 演唱会票务系统</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .uc-layout {
            display: flex;
            gap: 28px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .uc-sidebar {
            width: 240px;
            flex-shrink: 0;
        }

        .uc-sidebar .nav-card {
            background: var(--white);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: sticky;
            top: 100px;
        }

        .uc-sidebar .sidebar-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);
            padding: 28px 20px;
            text-align: center;
            color: white;
        }

        .uc-sidebar .sidebar-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 12px;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .uc-sidebar .sidebar-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .uc-sidebar .sidebar-name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .uc-sidebar .sidebar-desc {
            font-size: 12px;
            opacity: 0.8;
        }

        .uc-sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            color: var(--text-secondary);
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: var(--transition-fast);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .uc-sidebar .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .uc-sidebar .nav-item.active {
            background: var(--primary-light);
            color: var(--primary-color);
            border-left-color: var(--primary-color);
            font-weight: 600;
        }

        .uc-sidebar .nav-item .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .uc-main {
            flex: 1;
            min-width: 0;
        }

        .uc-panel {
            display: none;
            animation: fadeInUp 0.3s ease;
        }

        .uc-panel.active {
            display: block;
        }

        .panel-card {
            background: var(--white);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel-header {
            padding: 28px 32px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-header h2 .header-icon {
            font-size: 24px;
        }

        .panel-body {
            padding: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            font-size: 15px;
            transition: var(--transition-fast);
            background: var(--bg-secondary);
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .avatar-section {
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 24px;
            background: linear-gradient(145deg, var(--bg-secondary) 0%, var(--white) 100%);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-light);
        }

        .avatar-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-light);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .avatar-placeholder {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 36px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .avatar-upload-btn {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .avatar-upload-btn input[type=file] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            left: 0;
            top: 0;
        }

        .avatar-tip {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 10px;
        }

        .bind-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: linear-gradient(145deg, var(--bg-secondary) 0%, var(--white) 100%);
            border-radius: var(--border-radius);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
            transition: var(--transition-fast);
        }

        .bind-row:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-sm);
        }

        .bind-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .bind-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .bind-icon.phone {
            background: #dbeafe;
        }

        .bind-icon.email {
            background: #fef3c7;
        }

        .bind-info .bind-label {
            font-weight: 600;
            color: var(--text-color);
            font-size: 15px;
        }

        .bind-info .bind-value {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 2px;
        }

        .bind-actions {
            display: flex;
            gap: 8px;
        }

        .addr-card {
            background: var(--white);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 20px 24px;
            margin-bottom: 16px;
            position: relative;
            transition: var(--transition-fast);
        }

        .addr-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-sm);
            transform: translateY(-2px);
        }

        .addr-card.default {
            border-color: var(--primary-color);
            background: linear-gradient(145deg, var(--primary-light) 0%, var(--white) 100%);
        }

        .addr-card .addr-default-tag {
            position: absolute;
            top: 12px;
            right: 16px;
            background: linear-gradient(135deg, var(--primary-color), #7c3aed);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .addr-card .addr-name {
            font-weight: 700;
            color: var(--text-color);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .addr-card .addr-phone {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .addr-card .addr-detail {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-light);
        }

        .addr-card .addr-actions {
            margin-top: 14px;
            display: flex;
            gap: 10px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-box {
            background: var(--white);
            border-radius: var(--border-radius-lg);
            padding: 36px;
            width: 500px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-box h3 {
            margin-bottom: 24px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-light);
            color: var(--text-color);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--error-color), var(--error-hover));
            color: var(--white);
        }

        .btn-outline-primary {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-outline-primary:hover {
            background: var(--primary-color);
            color: var(--white);
        }

        @media (max-width: 768px) {
            .uc-layout {
                flex-direction: column;
                padding: 16px;
            }

            .uc-sidebar {
                width: 100%;
            }

            .uc-sidebar .nav-card {
                position: static;
            }

            .uc-sidebar .sidebar-header {
                padding: 20px;
            }

            .uc-sidebar .nav-item {
                padding: 12px 20px;
            }

            .panel-body {
                padding: 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">🎫 用户中心</div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="user-center.html" class="nav-link active">用户中心</a>
                <a href="operation-log.html" class="nav-link">操作日志</a>
            </div>
        </div>
    </nav>

    <div class="uc-layout">
        <div class="uc-sidebar">
            <div class="nav-card">
                <div class="sidebar-header">
                    <div class="sidebar-avatar" id="sidebarAvatar">?</div>
                    <div class="sidebar-name" id="sidebarName">用户</div>
                    <div class="sidebar-desc">管理您的账户</div>
                </div>
                <a class="nav-item active" data-panel="profile">
                    <span class="nav-icon">👤</span> 个人信息
                </a>
                <a class="nav-item" data-panel="password">
                    <span class="nav-icon">🔒</span> 修改密码
                </a>
                <a class="nav-item" data-panel="avatar">
                    <span class="nav-icon">📷</span> 头像设置
                </a>
                <a class="nav-item" data-panel="binding">
                    <span class="nav-icon">🔗</span> 账号绑定
                </a>
                <a class="nav-item" data-panel="address">
                    <span class="nav-icon">📍</span> 收货地址
                </a>
            </div>
        </div>

        <div class="uc-main">
            <div class="uc-panel active" id="panel-profile">
                <div class="panel-card">
                    <div class="panel-header">
                        <h2><span class="header-icon">👤</span> 个人信息</h2>
                    </div>
                    <div class="panel-body">
                        <div class="form-group">
                            <label>昵称</label>
                            <input type="text" id="profileNickname" placeholder="请输入昵称">
                        </div>
                        <div class="form-group">
                            <label>邮箱</label>
                            <input type="email" id="profileEmail" placeholder="请输入邮箱">
                        </div>
                        <button class="btn btn-primary" onclick="saveProfile()">保存修改</button>
                    </div>
                </div>
            </div>

            <div class="uc-panel" id="panel-password">
                <div class="panel-card">
                    <div class="panel-header">
                        <h2><span class="header-icon">🔒</span> 修改密码</h2>
                    </div>
                    <div class="panel-body">
                        <div class="form-group">
                            <label>原密码</label>
                            <input type="password" id="oldPassword" placeholder="请输入原密码">
                        </div>
                        <div class="form-group">
                            <label>新密码</label>
                            <input type="password" id="newPassword" placeholder="请输入新密码（至少6位）">
                        </div>
                        <div class="form-group">
                            <label>确认新密码</label>
                            <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                        </div>
                        <button class="btn btn-primary" onclick="changePassword()">修改密码</button>
                    </div>
                </div>
            </div>

            <div class="uc-panel" id="panel-avatar">
                <div class="panel-card">
                    <div class="panel-header">
                        <h2><span class="header-icon">📷</span> 头像设置</h2>
                    </div>
                    <div class="panel-body">
                        <div class="avatar-section">
                            <div id="avatarPreview"></div>
                            <div>
                                <div class="avatar-upload-btn">
                                    <button class="btn btn-outline-primary">选择图片</button>
                                    <input type="file" accept="image/*" onchange="uploadAvatar(this)">
                                </div>
                                <p class="avatar-tip">支持 JPG、PNG 格式，建议尺寸 200x200</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="uc-panel" id="panel-binding">
                <div class="panel-card">
                    <div class="panel-header">
                        <h2><span class="header-icon">🔗</span> 账号绑定</h2>
                    </div>
                    <div class="panel-body">
                        <div class="bind-row">
                            <div class="bind-info">
                                <div class="bind-icon phone">📱</div>
                                <div>
                                    <div class="bind-label">手机号</div>
                                    <div class="bind-value" id="bindPhoneValue">未绑定</div>
                                </div>
                            </div>
                            <div class="bind-actions">
                                <button class="btn btn-sm btn-primary" id="btnBindPhone" onclick="showBindPhoneModal()">绑定</button>
                                <button class="btn btn-sm btn-danger" id="btnUnbindPhone" onclick="unbindPhone()" style="display:none">解绑</button>
                            </div>
                        </div>
                        <div class="bind-row">
                            <div class="bind-info">
                                <div class="bind-icon email">📧</div>
                                <div>
                                    <div class="bind-label">邮箱</div>
                                    <div class="bind-value" id="bindEmailValue">未绑定</div>
                                </div>
                            </div>
                            <div class="bind-actions">
                                <button class="btn btn-sm btn-primary" id="btnBindEmail" onclick="showBindEmailModal()">绑定</button>
                                <button class="btn btn-sm btn-danger" id="btnUnbindEmail" onclick="unbindEmail()" style="display:none">解绑</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="uc-panel" id="panel-address">
                <div class="panel-card">
                    <div class="panel-header">
                        <h2><span class="header-icon">📍</span> 收货地址</h2>
                        <button class="btn btn-primary" onclick="showAddressModal()">+ 新增地址</button>
                    </div>
                    <div class="panel-body">
                        <div id="addressList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bindPhoneModal" style="display:none">
        <div class="modal-box">
            <h3>📱 绑定手机号</h3>
            <div class="form-group"><label>手机号</label><input type="tel" id="bindPhoneInput" placeholder="请输入手机号"></div>
            <div class="form-row">
                <div class="form-group"><label>验证码</label><input type="text" id="bindPhoneCode" placeholder="请输入验证码"></div>
                <div class="form-group" style="flex:none;padding-top:28px"><button class="btn btn-secondary" onclick="sendBindPhoneCode()">发送验证码</button></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('bindPhoneModal')">取消</button>
                <button class="btn btn-primary" onclick="confirmBindPhone()">确认绑定</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bindEmailModal" style="display:none">
        <div class="modal-box">
            <h3>📧 绑定邮箱</h3>
            <div class="form-group"><label>邮箱</label><input type="email" id="bindEmailInput" placeholder="请输入邮箱"></div>
            <div class="form-row">
                <div class="form-group"><label>验证码</label><input type="text" id="bindEmailCode" placeholder="请输入验证码"></div>
                <div class="form-group" style="flex:none;padding-top:28px"><button class="btn btn-secondary" onclick="sendBindEmailCode()">发送验证码</button></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('bindEmailModal')">取消</button>
                <button class="btn btn-primary" onclick="confirmBindEmail()">确认绑定</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addressModal" style="display:none">
        <div class="modal-box">
            <h3 id="addressModalTitle">📍 新增收货地址</h3>
            <input type="hidden" id="addressEditId">
            <div class="form-group"><label>收货人</label><input type="text" id="addrReceiverName" placeholder="请输入收货人姓名"></div>
            <div class="form-group"><label>手机号</label><input type="tel" id="addrReceiverPhone" placeholder="请输入手机号"></div>
            <div class="form-row">
                <div class="form-group"><label>省</label><input type="text" id="addrProvince" placeholder="省"></div>
                <div class="form-group"><label>市</label><input type="text" id="addrCity" placeholder="市"></div>
                <div class="form-group"><label>区</label><input type="text" id="addrDistrict" placeholder="区"></div>
            </div>
            <div class="form-group"><label>详细地址</label><textarea id="addrDetail" rows="2" placeholder="请输入详细地址"></textarea></div>
            <div class="form-group"><label><input type="checkbox" id="addrIsDefault"> 设为默认地址</label></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addressModal')">取消</button>
                <button class="btn btn-primary" onclick="saveAddress()">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
let currentUser = null;

document.querySelectorAll('.uc-sidebar .nav-item').forEach(function(item) {
    item.addEventListener('click', function() {
        document.querySelectorAll('.uc-sidebar .nav-item').forEach(function(n) { n.classList.remove('active'); });
        document.querySelectorAll('.uc-panel').forEach(function(p) { p.classList.remove('active'); });
        this.classList.add('active');
        var panel = this.getAttribute('data-panel');
        document.getElementById('panel-' + panel).classList.add('active');
        if (panel === 'address') loadAddresses();
    });
});

async function loadProfile() {
    try {
        var res = await api.userCenter.getProfile();
        if (res.code === 200) {
            currentUser = res.data.user;
            document.getElementById('profileNickname').value = currentUser.nickname || '';
            document.getElementById('profileEmail').value = currentUser.email || '';
            updateAvatarPreview();
            updateBindingInfo();
            updateSidebarInfo();
        }
    } catch (e) {
        console.error('加载用户信息失败', e);
    }
}

function updateSidebarInfo() {
    if (!currentUser) return;
    var name = currentUser.nickname || '用户';
    document.getElementById('sidebarName').textContent = name;
    var avatarEl = document.getElementById('sidebarAvatar');
    if (currentUser.avatarUrl) {
        avatarEl.innerHTML = '<img src="' + currentUser.avatarUrl + '" alt="头像">';
    } else {
        avatarEl.textContent = name.charAt(0);
    }
}

function updateAvatarPreview() {
    var el = document.getElementById('avatarPreview');
    if (currentUser && currentUser.avatarUrl) {
        el.innerHTML = '<img class="avatar-img" src="' + currentUser.avatarUrl + '" alt="头像">';
    } else {
        var name = (currentUser && currentUser.nickname) ? currentUser.nickname.charAt(0) : '?';
        el.innerHTML = '<div class="avatar-placeholder">' + name + '</div>';
    }
}

function updateBindingInfo() {
    if (!currentUser) return;
    var phone = currentUser.phone;
    var email = currentUser.email;
    document.getElementById('bindPhoneValue').textContent = phone || '未绑定';
    document.getElementById('bindEmailValue').textContent = email || '未绑定';
    document.getElementById('btnBindPhone').style.display = phone ? 'none' : 'inline-block';
    document.getElementById('btnUnbindPhone').style.display = phone ? 'inline-block' : 'none';
    document.getElementById('btnBindEmail').style.display = email ? 'none' : 'inline-block';
    document.getElementById('btnUnbindEmail').style.display = email ? 'inline-block' : 'none';
}

async function saveProfile() {
    var nickname = document.getElementById('profileNickname').value.trim();
    var email = document.getElementById('profileEmail').value.trim();
    try {
        var res = await api.userCenter.updateProfile(nickname, email);
        if (res.code === 200) {
            alert('保存成功');
            await loadProfile();
        } else {
            alert(res.message || '保存失败');
        }
    } catch (e) {
        alert('保存失败');
    }
}

async function changePassword() {
    var oldPwd = document.getElementById('oldPassword').value;
    var newPwd = document.getElementById('newPassword').value;
    var confirmPwd = document.getElementById('confirmPassword').value;
    if (!oldPwd || !newPwd) { alert('请填写完整'); return; }
    if (newPwd !== confirmPwd) { alert('两次输入的新密码不一致'); return; }
    if (newPwd.length < 6) { alert('新密码长度不能少于6位'); return; }
    try {
        var res = await api.userCenter.changePassword(oldPwd, newPwd);
        if (res.code === 200) {
            alert('密码修改成功，请重新登录');
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        } else {
            alert(res.message || '修改失败');
        }
    } catch (e) {
        alert('修改失败');
    }
}

async function uploadAvatar(input) {
    if (!input.files || !input.files[0]) return;
    try {
        var res = await api.userCenter.uploadAvatar(input.files[0]);
        if (res.code === 200) {
            var avatarRes = await api.userCenter.updateAvatar(res.data);
            if (avatarRes.code === 200) {
                alert('头像更新成功');
                await loadProfile();
            }
        } else {
            alert('上传失败');
        }
    } catch (e) {
        alert('上传失败');
    }
}

function showBindPhoneModal() { document.getElementById('bindPhoneModal').style.display = 'flex'; }
function showBindEmailModal() { document.getElementById('bindEmailModal').style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

async function sendBindPhoneCode() {
    var phone = document.getElementById('bindPhoneInput').value.trim();
    if (!phone) { alert('请输入手机号'); return; }
    try {
        var res = await api.auth.getVerificationCode();
        if (res.code === 200) {
            alert('验证码已发送（演示模式，验证码见控制台）');
        }
    } catch (e) { alert('发送失败'); }
}

async function sendBindEmailCode() {
    var email = document.getElementById('bindEmailInput').value.trim();
    if (!email) { alert('请输入邮箱'); return; }
    try {
        var res = await api.auth.sendEmailCode(email);
        if (res.code === 200) { alert('验证码已发送到您的邮箱'); }
        else { alert(res.message || '发送失败'); }
    } catch (e) { alert('发送失败'); }
}

async function confirmBindPhone() {
    var phone = document.getElementById('bindPhoneInput').value.trim();
    var code = document.getElementById('bindPhoneCode').value.trim();
    if (!phone || !code) { alert('请填写完整'); return; }
    try {
        var res = await api.userCenter.bindPhone(phone, code);
        if (res.code === 200) { alert('绑定成功'); closeModal('bindPhoneModal'); await loadProfile(); }
        else { alert(res.message || '绑定失败'); }
    } catch (e) { alert('绑定失败'); }
}

async function confirmBindEmail() {
    var email = document.getElementById('bindEmailInput').value.trim();
    var code = document.getElementById('bindEmailCode').value.trim();
    if (!email || !code) { alert('请填写完整'); return; }
    try {
        var res = await api.userCenter.bindEmail(email, code);
        if (res.code === 200) { alert('绑定成功'); closeModal('bindEmailModal'); await loadProfile(); }
        else { alert(res.message || '绑定失败'); }
    } catch (e) { alert('绑定失败'); }
}

async function unbindPhone() {
    if (!confirm('确定解绑手机号？')) return;
    try {
        var res = await api.userCenter.unbindPhone();
        if (res.code === 200) { alert('解绑成功'); await loadProfile(); }
        else { alert(res.message || '解绑失败'); }
    } catch (e) { alert('解绑失败'); }
}

async function unbindEmail() {
    if (!confirm('确定解绑邮箱？')) return;
    try {
        var res = await api.userCenter.unbindEmail();
        if (res.code === 200) { alert('解绑成功'); await loadProfile(); }
        else { alert(res.message || '解绑失败'); }
    } catch (e) { alert('解绑失败'); }
}

async function loadAddresses() {
    try {
        var res = await api.userCenter.getAddresses();
        if (res.code === 200) {
            renderAddresses(res.data || []);
        }
    } catch (e) {
        console.error('加载地址失败', e);
    }
}

function renderAddresses(addrs) {
    var container = document.getElementById('addressList');
    if (!addrs || addrs.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>暂无收货地址</p></div>';
        return;
    }
    container.innerHTML = addrs.map(function(addr) {
        return '<div class="addr-card' + (addr.isDefault === 1 ? ' default' : '') + '">' +
            (addr.isDefault === 1 ? '<span class="addr-default-tag">默认</span>' : '') +
            '<div class="addr-name">' + escapeHtml(addr.receiverName) + '</div>' +
            '<div class="addr-phone">' + escapeHtml(addr.receiverPhone) + '</div>' +
            '<div class="addr-detail">' + escapeHtml((addr.province || '') + (addr.city || '') + (addr.district || '') + (addr.detailAddress || '')) + '</div>' +
            '<div class="addr-actions">' +
            '<button class="btn btn-sm btn-outline-primary" onclick="editAddress(' + addr.id + ')">编辑</button>' +
            (addr.isDefault !== 1 ? '<button class="btn btn-sm btn-secondary" onclick="setDefaultAddr(' + addr.id + ')">设为默认</button>' : '') +
            '<button class="btn btn-sm btn-danger" onclick="deleteAddr(' + addr.id + ')">删除</button>' +
            '</div></div>';
    }).join('');
}

function escapeHtml(text) {
    if (!text) return '';
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showAddressModal(addr) {
    document.getElementById('addressModalTitle').textContent = addr ? '编辑收货地址' : '新增收货地址';
    document.getElementById('addressEditId').value = addr ? addr.id : '';
    document.getElementById('addrReceiverName').value = addr ? addr.receiverName : '';
    document.getElementById('addrReceiverPhone').value = addr ? addr.receiverPhone : '';
    document.getElementById('addrProvince').value = addr ? (addr.province || '') : '';
    document.getElementById('addrCity').value = addr ? (addr.city || '') : '';
    document.getElementById('addrDistrict').value = addr ? (addr.district || '') : '';
    document.getElementById('addrDetail').value = addr ? (addr.detailAddress || '') : '';
    document.getElementById('addrIsDefault').checked = addr ? addr.isDefault === 1 : false;
    document.getElementById('addressModal').style.display = 'flex';
}

async function editAddress(id) {
    try {
        var res = await api.userCenter.getAddress(id);
        if (res.code === 200) { showAddressModal(res.data); }
    } catch (e) { alert('加载地址失败'); }
}

async function saveAddress() {
    var editId = document.getElementById('addressEditId').value;
    var addr = {
        receiverName: document.getElementById('addrReceiverName').value.trim(),
        receiverPhone: document.getElementById('addrReceiverPhone').value.trim(),
        province: document.getElementById('addrProvince').value.trim(),
        city: document.getElementById('addrCity').value.trim(),
        district: document.getElementById('addrDistrict').value.trim(),
        detailAddress: document.getElementById('addrDetail').value.trim(),
        isDefault: document.getElementById('addrIsDefault').checked ? 1 : 0
    };
    if (!addr.receiverName || !addr.receiverPhone || !addr.detailAddress) { alert('请填写必要信息'); return; }
    try {
        var res = editId ? await api.userCenter.updateAddress(editId, addr) : await api.userCenter.addAddress(addr);
        if (res.code === 200) { closeModal('addressModal'); loadAddresses(); }
        else { alert(res.message || '保存失败'); }
    } catch (e) { alert('保存失败'); }
}

async function deleteAddr(id) {
    if (!confirm('确定删除该地址？')) return;
    try {
        var res = await api.userCenter.deleteAddress(id);
        if (res.code === 200) loadAddresses();
        else alert(res.message || '删除失败');
    } catch (e) { alert('删除失败'); }
}

async function setDefaultAddr(id) {
    try {
        var res = await api.userCenter.setDefaultAddress(id);
        if (res.code === 200) loadAddresses();
    } catch (e) { alert('设置失败'); }
}

document.addEventListener('DOMContentLoaded', function() {
    var token = localStorage.getItem('token');
    if (!token) { window.location.href = 'index.html'; return; }
    loadProfile();
});
</script>
</body>
</html>
