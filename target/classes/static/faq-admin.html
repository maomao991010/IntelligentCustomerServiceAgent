<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ 管理 - 富文本知识库</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 32px;
        }
        
        .page-header-section {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);
            padding: 40px;
            border-radius: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .page-header-section h1 {
            margin: 0;
            color: white;
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .page-header-section h1::before {
            content: '📚';
            font-size: 40px;
        }
        
        .list-section {
            background: var(--white);
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.08);
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .faq-list {
            max-height: 700px;
            overflow-y: auto;
        }
        
        .faq-item {
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        
        .faq-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }
        
        .faq-question {
            font-weight: 600;
            color: #1e293b;
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        .faq-meta {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 12px;
        }
        
        .faq-category {
            background: #e0e7ff;
            color: #4338ca;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .faq-answer-preview {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            max-height: 60px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        .faq-item-actions {
            display: flex;
            gap: 8px;
        }
        
        .faq-item-actions .btn {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 10px;
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #94a3b8;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #f1f5f9;
        }
        
        .pagination .btn {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 10px;
        }
        
        .pagination-info {
            color: #64748b;
            font-size: 14px;
            margin: 0 16px;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .modal-header {
            padding: 24px 32px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .modal-close:hover {
            background: #f1f5f9;
            color: #1e293b;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8fafc;
            box-sizing: border-box;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        
        .editor-container {
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
            background: #f8fafc;
        }
        
        .editor-container:focus-within {
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        
        #editor {
            min-height: 300px;
            background: white;
        }
        
        .modal-footer {
            padding: 24px 32px;
            border-top: 2px solid #f1f5f9;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        
        .modal-footer .btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);
            border-color: transparent;
            color: white;
        }
        
        .btn-add {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: white;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">🎫 后台管理</div>
                <div class="nav-links">
                    <a href="admin-home.html" class="nav-link">演唱会管理</a>
                    <a href="admin.html" class="nav-link">添加/编辑演唱会</a>
                    <a href="faq-admin.html" class="nav-link active">FAQ 管理</a>
                    <a href="token-usage.html" class="nav-link">Token 用量</a>
                    <a href="role-manage.html" class="nav-link">角色管理</a>
                    <a href="permission-manage.html" class="nav-link">权限管理</a>
                    <a href="user-role-assign.html" class="nav-link">用户角色</a>
                    <a href="role-permission-assign.html" class="nav-link">角色权限</a>
                    <a href="user-info.html" class="nav-link">👤 个人信息</a>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="admin-container">
                <div class="page-header-section">
                    <h1>FAQ 知识库管理</h1>
                    <button class="btn-add perm-faq-add" onclick="openAddModal()" style="display: none;">
                        ➕ 添加 FAQ
                    </button>
                </div>
                
                <div class="list-section">
                    <div class="section-title">
                        <span>📋 FAQ 列表</span>
                    </div>
                    <div id="faqList" class="faq-list">
                        <div class="empty-state">
                            <div class="empty-state-icon">📚</div>
                            <p>加载中...</p>
                        </div>
                    </div>
                    <div class="pagination" id="pagination">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="faqModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">添加 FAQ</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="faqForm">
                    <input type="hidden" id="faqId">
                    
                    <div class="form-group">
                        <label for="question">❓ 问题</label>
                        <input type="text" id="question" placeholder="请输入问题" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">📂 分类</label>
                        <select id="category" required>
                            <option value="">请选择分类</option>
                            <option value="场次查询">场次查询</option>
                            <option value="购票咨询">购票咨询</option>
                            <option value="退票咨询">退票咨询</option>
                            <option value="账户问题">账户问题</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="keywords">🏷️ 关键词（逗号分隔）</label>
                        <input type="text" id="keywords" placeholder="例如：购票,流程,步骤">
                    </div>
                    
                    <div class="form-group">
                        <label>📝 回答（富文本）</label>
                        <div class="editor-container">
                            <div id="editor"></div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal()">取消</button>
                <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;" onclick="deleteFaq()">🗑️ 删除</button>
                <button type="button" class="btn btn-primary" id="submitBtn" onclick="handleSubmit()">✨ 添加 FAQ</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        let quill = null;
        let currentFaqId = null;
        let faqListData = [];
        let currentPage = 1;
        let pageSize = 10;
        let totalPages = 1;
        let total = 0;

        document.addEventListener('DOMContentLoaded', function() {
            initEditor();
            loadFaqList();
        });

        function initEditor() {
            quill = new Quill('#editor', {
                theme: 'snow',
                placeholder: '请输入回答内容...',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, 3, 4, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        [{ 'indent': '-1'}, { 'indent': '+1' }],
                        ['blockquote', 'code-block'],
                        ['link', 'image'],
                        ['clean']
                    ]
                }
            });
        }

        async function loadFaqList() {
            try {
                const response = await api.chat.getFaqPage(currentPage, pageSize);
                if (response.code === 200) {
                    const pageData = response.data;
                    
                    faqListData = pageData.records || pageData || [];
                    total = pageData.total || pageData.totalElements || faqListData.length;
                    totalPages = pageData.pages || pageData.totalPages || Math.ceil(total / pageSize);
                    
                    renderFaqList(faqListData);
                    renderPagination();
                } else {
                    alert('加载失败：' + response.message);
                }
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('faqList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <p>加载失败，请稍后重试</p>
                    </div>
                `;
            }
        }

        function renderFaqList(faqs) {
            const container = document.getElementById('faqList');
            
            if (!faqs || faqs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无 FAQ 数据</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = faqs.map(faq => `
                <div class="faq-item">
                    <div class="faq-question">${escapeHtml(faq.question)}</div>
                    <div class="faq-meta">
                        <span class="faq-category">${escapeHtml(faq.category || '其他')}</span>
                    </div>
                    <div class="faq-answer-preview">${stripHtml(faq.answer || '')}</div>
                    <div class="faq-item-actions">
                        <button type="button" class="btn btn-outline perm-faq-edit" 
                                onclick="openEditModal(${faq.id})" style="display: none;">编辑</button>
                        <button type="button" class="btn btn-danger perm-faq-delete" 
                                onclick="confirmDelete(${faq.id})" style="display: none;">删除</button>
                    </div>
                </div>
            `).join('');
            
            if (typeof applyPermissionControls === 'function') applyPermissionControls();
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            
            let html = '';
            
            if (totalPages > 1) {
                html = `
                    <button class="btn btn-outline" onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>首页</button>
                    <button class="btn btn-outline" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
                    <span class="pagination-info">第 ${currentPage} / ${totalPages} 页，共 ${total} 条</span>
                    <button class="btn btn-outline" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>
                    <button class="btn btn-outline" onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>末页</button>
                `;
            } else if (total > 0) {
                html = `<span class="pagination-info">共 ${total} 条</span>`;
            }
            
            container.innerHTML = html;
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadFaqList();
        }

        function openAddModal() {
            currentFaqId = null;
            document.getElementById('modalTitle').textContent = '添加 FAQ';
            document.getElementById('submitBtn').textContent = '✨ 添加 FAQ';
            document.getElementById('deleteBtn').style.display = 'none';
            resetForm();
            document.getElementById('faqModal').classList.add('active');
        }

        async function openEditModal(id) {
            try {
                const response = await api.chat.getFaq(id);
                if (response.code === 200) {
                    const faq = response.data;
                    currentFaqId = faq.id;
                    document.getElementById('faqId').value = faq.id;
                    document.getElementById('question').value = faq.question || '';
                    document.getElementById('category').value = faq.category || '';
                    document.getElementById('keywords').value = faq.keywords || '';
                    
                    if (faq.answer) {
                        quill.root.innerHTML = faq.answer;
                    } else {
                        quill.root.innerHTML = '';
                    }
                    
                    document.getElementById('modalTitle').textContent = '编辑 FAQ';
                    document.getElementById('submitBtn').textContent = '✨ 更新 FAQ';
                    document.getElementById('deleteBtn').style.display = 'inline-block';
                    document.getElementById('faqModal').classList.add('active');
                } else {
                    alert('加载失败：' + response.message);
                }
            } catch (error) {
                console.error('加载失败:', error);
                alert('加载失败，请稍后重试');
            }
        }

        function closeModal() {
            document.getElementById('faqModal').classList.remove('active');
            resetForm();
        }

        async function handleSubmit() {
            const faqId = document.getElementById('faqId').value;
            const question = document.getElementById('question').value;
            const category = document.getElementById('category').value;
            const keywords = document.getElementById('keywords').value;
            const answer = quill.root.innerHTML;
            
            if (!question || !category) {
                alert('请填写完整信息');
                return;
            }
            
            const faqData = {
                question: question,
                answer: answer,
                category: category,
                keywords: keywords,
                status: 'ACTIVE',
                sortOrder: 0
            };
            
            try {
                let response;
                if (faqId) {
                    response = await api.chat.updateFaq(parseInt(faqId), faqData);
                } else {
                    response = await api.chat.createFaq(faqData);
                }
                
                if (response.code === 200) {
                    alert(faqId ? '更新成功！' : '添加成功！');
                    closeModal();
                    loadFaqList();
                } else {
                    alert(faqId ? '更新失败：' + response.message : '添加失败：' + response.message);
                }
            } catch (error) {
                console.error('操作失败:', error);
                alert('操作失败，请稍后重试');
            }
        }

        function resetForm() {
            document.getElementById('faqId').value = '';
            document.getElementById('question').value = '';
            document.getElementById('category').value = '';
            document.getElementById('keywords').value = '';
            quill.root.innerHTML = '';
            currentFaqId = null;
        }

        function confirmDelete(id) {
            if (confirm('确定要删除这个 FAQ 吗？')) {
                deleteFaq(id);
            }
        }

        async function deleteFaq(id) {
            const faqId = id || document.getElementById('faqId').value;
            if (!faqId) {
                alert('请先选择要删除的 FAQ');
                return;
            }
            
            try {
                const response = await api.chat.deleteFaq(parseInt(faqId));
                if (response.code === 200) {
                    alert('删除成功！');
                    closeModal();
                    loadFaqList();
                } else {
                    alert('删除失败：' + response.message);
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败，请稍后重试');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function stripHtml(html) {
            if (!html) return '';
            const div = document.createElement('div');
            div.innerHTML = html;
            let text = div.textContent || div.innerText || '';
            text = text.replace(/\s+/g, ' ').trim();
            if (text.length > 100) {
                text = text.substring(0, 100) + '...';
            }
            return text;
        }

        document.addEventListener('permissionsLoaded', function() {
            if (typeof applyPermissionControls === 'function') applyPermissionControls();
        });
    </script>
    <script src="js/auth-check.js"></script>
    <script src="js/user-info.js"></script>
</body>
</html>
