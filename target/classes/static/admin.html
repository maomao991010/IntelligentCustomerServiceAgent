<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 添加/编辑演唱会</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 32px;
        }
        
        .page-header-section {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);
            padding: 40px;
            border-radius: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.4);
        }
        
        .page-header-section h1 {
            margin: 0;
            color: white;
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .page-header-section h1::before {
            content: '🎤';
            font-size: 40px;
        }
        
        .form-container {
            background: var(--white);
            padding: 48px;
            border-radius: 24px;
            box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.08);
        }
        
        .form-section {
            margin-bottom: 40px;
        }
        
        .form-section-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }
        
        .form-group {
            margin-bottom: 28px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8fafc;
            box-sizing: border-box;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #94a3b8;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 140px;
        }
        
        .form-group-full {
            grid-column: 1 / -1;
        }
        
        .image-upload-section {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 20px;
            padding: 32px;
        }
        
        .image-upload {
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 56px 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }
        
        .image-upload:hover {
            border-color: var(--primary-color);
            background: #eff6ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }
        
        .image-upload-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        
        .image-upload-text {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .image-upload-hint {
            font-size: 14px;
            color: #64748b;
        }
        
        .image-preview {
            margin-top: 32px;
            text-align: center;
        }
        
        .image-preview img {
            max-width: 100%;
            max-height: 350px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        
        .form-actions {
            display: flex;
            gap: 20px;
            margin-top: 48px;
            padding-top: 32px;
            border-top: 2px solid #f1f5f9;
        }
        
        .form-actions .btn {
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            transition: all 0.3s ease;
        }
        
        .form-actions .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .form-actions .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);
            border-color: transparent;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">🎫 后台管理</div>
                <div class="nav-links">
                    <a href="admin-home.html" class="nav-link">演唱会管理</a>
                    <a href="admin.html" class="nav-link active">添加/编辑演唱会</a>
                    <a href="faq-admin.html" class="nav-link">FAQ 管理</a>
                    <a href="token-usage.html" class="nav-link">Token 用量</a>
                    <a href="role-manage.html" class="nav-link">角色管理</a>
                    <a href="permission-manage.html" class="nav-link">权限管理</a>
                    <a href="user-role-assign.html" class="nav-link">用户角色</a>
                    <a href="role-permission-assign.html" class="nav-link">角色权限</a>
                    <a href="user-info.html" class="nav-link">👤 个人信息</a>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="admin-container">
                <div class="page-header-section">
                    <h1 id="pageTitle">添加演唱会信息</h1>
                </div>
                
                <div class="form-container">
                    <form id="sessionForm">
                        <input type="hidden" id="sessionId" name="sessionId">
                        
                        <div class="form-section">
                            <div class="form-section-title">📝 基本信息</div>
                            <div class="form-grid">
                                <div class="form-group form-group-full">
                                    <label for="activityName">🎵 演唱会名称</label>
                                    <input type="text" id="activityName" name="activityName" placeholder="请输入演唱会名称" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="activityId">📋 活动ID</label>
                                    <input type="number" id="activityId" name="activityId" placeholder="请输入活动ID">
                                </div>
                                
                                <div class="form-group">
                                    <label for="venue">📍 场馆</label>
                                    <input type="text" id="venue" name="venue" placeholder="请输入场馆名称" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <div class="form-section-title">📅 时间与座位</div>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="date">📆 日期</label>
                                    <input type="date" id="date" name="date" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="time">⏰ 时间</label>
                                    <input type="time" id="time" name="time" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="totalSeats">🎫 总座位数</label>
                                    <input type="number" id="totalSeats" name="totalSeats" placeholder="请输入总座位数" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <div class="form-section-title">💰 价格信息</div>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="minPrice">💵 最低价格 (元)</label>
                                    <input type="number" id="minPrice" name="minPrice" placeholder="请输入最低价格" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="maxPrice">💶 最高价格 (元)</label>
                                    <input type="number" id="maxPrice" name="maxPrice" placeholder="请输入最高价格" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <div class="form-section-title">🖼️ 演唱会图片</div>
                            <div class="image-upload-section">
                                <div class="image-upload" onclick="document.getElementById('fileInput').click()">
                                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                                    <div class="image-upload-icon">📷</div>
                                    <div class="image-upload-text">点击上传演唱会海报</div>
                                    <div class="image-upload-hint">支持 JPG、PNG 格式，建议尺寸 800×600</div>
                                </div>
                                <div class="image-preview" id="imagePreview"></div>
                                <input type="hidden" id="imagePath" name="imagePath">
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <a href="admin-home.html" class="btn btn-outline">← 返回列表</a>
                            <button type="reset" class="btn btn-outline">🔄 重置</button>
                            <button type="submit" class="btn btn-primary" id="submitBtn">✨ 添加演唱会</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        // API基础URL
        const API_BASE_URL = '/api/v1';
        // 缓存配置
        const CACHE_KEY = 'sessions_cache';

        // 获取URL参数
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 编辑模式：加载演唱会信息
        async function loadSessionData(sessionId) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json'
            };
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }
            
            try {
                const response = await fetch(API_BASE_URL + '/sessions/' + sessionId, {
                    method: 'GET',
                    headers: headers
                });
                
                const data = await response.json();
                if (data.code === 200) {
                    const session = data.data;
                    document.getElementById('sessionId').value = session.id;
                    document.getElementById('activityName').value = session.activityName;
                    document.getElementById('activityId').value = session.activityId || 1;
                    document.getElementById('date').value = session.date;
                    document.getElementById('time').value = session.time;
                    document.getElementById('venue').value = session.venue;
                    document.getElementById('totalSeats').value = session.totalSeats;
                    document.getElementById('minPrice').value = session.minPrice;
                    document.getElementById('maxPrice').value = session.maxPrice;
                    document.getElementById('imagePath').value = session.imagePath;
                    
                    // 显示图片预览
                    if (session.imagePath) {
                        const imagePreview = document.getElementById('imagePreview');
                        imagePreview.innerHTML = `<img src="${session.imagePath}" alt="预览图片">`;
                    }
                    
                    // 更新页面标题和按钮文本
                    document.getElementById('pageTitle').textContent = '编辑演唱会信息';
                    document.getElementById('submitBtn').textContent = '✨ 更新演唱会';
                } else {
                    alert('加载失败：' + data.message);
                }
            } catch (error) {
                console.error('加载失败:', error);
                alert('加载失败，请稍后重试');
            }
        }

        // 表单提交
        document.getElementById('sessionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sessionId = document.getElementById('sessionId').value;
            const formData = new FormData();
            formData.append('activityName', document.getElementById('activityName').value);
            formData.append('activityId', document.getElementById('activityId').value || 1);
            formData.append('date', document.getElementById('date').value);
            formData.append('time', document.getElementById('time').value);
            formData.append('venue', document.getElementById('venue').value);
            formData.append('totalSeats', document.getElementById('totalSeats').value);
            formData.append('minPrice', document.getElementById('minPrice').value);
            formData.append('maxPrice', document.getElementById('maxPrice').value);
            formData.append('imagePath', document.getElementById('imagePath').value);

            try {
                const url = sessionId ? API_BASE_URL + '/sessions/' + sessionId : API_BASE_URL + '/sessions';
                const method = sessionId ? 'PUT' : 'POST';
                
                const token = localStorage.getItem('token');
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                
                const response = await fetch(url, {
                    method: method,
                    headers: headers,
                    body: JSON.stringify(Object.fromEntries(formData))
                });

                const data = await response.json();
                if (data.code === 200) {
                    // 如果是添加操作，生成座位信息
                    if (!sessionId) {
                        await generateSeats(data.data.id, document.getElementById('totalSeats').value);
                    }
                    // 清除缓存，确保主页能获取最新数据
                    clearSessionCache(data.data.id);
                    alert(sessionId ? '更新成功！' : '添加成功！');
                    window.location.href = 'admin-home.html';
                } else {
                    alert(sessionId ? '更新失败：' + data.message : '添加失败：' + data.message);
                }
            } catch (error) {
                console.error('操作失败:', error);
                alert('操作失败，请稍后重试');
            }
        });

        // 生成座位信息
        async function generateSeats(sessionId, totalSeats) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json'
            };
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }
            
            try {
                const response = await fetch(API_BASE_URL + '/seats/generate', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        sessionId: sessionId,
                        totalSeats: totalSeats
                    })
                });
                
                const data = await response.json();
                if (data.code !== 200) {
                    console.error('座位生成失败:', data.message);
                    alert('演唱会添加成功，但座位生成失败，请手动生成座位');
                }
            } catch (error) {
                console.error('座位生成失败:', error);
                alert('演唱会添加成功，但座位生成失败，请手动生成座位');
            }
        }

        // 图片上传
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const token = localStorage.getItem('token');
            const headers = {};
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }

            try {
                const response = await fetch(API_BASE_URL + '/files/upload', {
                    method: 'POST',
                    headers: headers,
                    body: formData
                });

                const data = await response.json();
                if (data.code === 200) {
                    const imagePath = data.data;
                    document.getElementById('imagePath').value = imagePath;
                    
                    // 显示图片预览
                    const imagePreview = document.getElementById('imagePreview');
                    imagePreview.innerHTML = `<img src="${imagePath}" alt="预览图片">`;
                } else {
                    alert('图片上传失败：' + data.message);
                }
            } catch (error) {
                console.error('图片上传失败:', error);
                alert('图片上传失败，请稍后重试');
            }
        });

        // 清除演唱会相关缓存
        function clearSessionCache(sessionId) {
            try {
                // 清除图片缓存
                const imageCacheKey = `image_${sessionId}`;
                localStorage.removeItem(imageCacheKey);
                
                // 清除整个演唱会列表缓存，确保主页能获取最新数据
                localStorage.removeItem(CACHE_KEY);
                console.log('已清除演唱会缓存');
            } catch (error) {
                console.error('清除缓存失败:', error);
            }
        }

        // 检查是否是编辑模式
        const sessionId = getUrlParam('id');
        if (sessionId) {
            loadSessionData(sessionId);
        }

        function checkAdminPermission() {
            if (typeof hasPermission === 'function') {
                var isEdit = sessionId ? true : false;
                var requiredPerm = isEdit ? 'activity:edit' : 'activity:add';
                if (!hasPermission(requiredPerm)) {
                    alert('您没有' + (isEdit ? '编辑' : '添加') + '演唱会的权限');
                    window.location.href = 'admin-home.html';
                }
            }
        }

        document.addEventListener('permissionsLoaded', function() {
            checkAdminPermission();
        });
    </script>
    <script src="js/auth-check.js"></script>
    <script src="js/user-info.js"></script>
</body>
</html>
