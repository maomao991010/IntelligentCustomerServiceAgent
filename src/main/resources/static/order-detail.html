<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 演唱会票务系统</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .order-detail-container{max-width:900px;margin:0 auto;padding:24px}
        .order-card{background:var(--white);border-radius:var(--border-radius);box-shadow:var(--shadow-sm);margin-bottom:20px;overflow:hidden}
        .order-card-header{padding:16px 24px;background:var(--bg-secondary);font-weight:600;font-size:16px;border-bottom:1px solid var(--border-light)}
        .order-card-body{padding:24px}
        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .info-item{display:flex;flex-direction:column;gap:4px}
        .info-item .label{font-size:13px;color:var(--text-muted)}
        .info-item .value{font-size:15px;color:var(--text-color);font-weight:500}
        .status-badge{display:inline-block;padding:4px 14px;border-radius:16px;font-size:13px;font-weight:500}
        .status-PENDING_PAYMENT{background:#fef3c7;color:#92400e}
        .status-PAID{background:#dcfce7;color:#166534}
        .status-CANCELLED{background:#fee2e2;color:#991b1b}
        .status-REFUNDED{background:#e0e7ff;color:#3730a3}
        .status-REFUNDING{background:#dbeafe;color:#1e40af}
        .action-bar{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
        .ticket-card{border:2px dashed var(--primary-color);border-radius:12px;padding:24px;text-align:center;margin-top:16px}
        .ticket-card .qr-img{width:200px;height:200px;margin:16px auto;border:4px solid var(--white);box-shadow:var(--shadow-sm)}
        .ticket-card .ticket-code{font-size:20px;font-weight:700;color:var(--primary-color);letter-spacing:2px}
        .refund-form{margin-top:16px}
        .refund-form textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border-color);border-radius:var(--border-radius-sm);font-size:14px;resize:vertical}
        .refund-form select{padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--border-radius-sm);font-size:14px;margin-bottom:12px;width:100%}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}
        .modal-box{background:var(--white);border-radius:var(--border-radius);padding:24px;width:420px;max-width:90vw}
        .modal-box h3{margin:0 0 16px}
        .modal-box textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border-color);border-radius:var(--border-radius-sm);font-size:14px;resize:vertical;margin-bottom:12px}
        .modal-box .btn-row{display:flex;gap:8px;justify-content:flex-end}
    </style>
</head>
<body>
<div id="app">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">🎫 票务系统</div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="user-center.html" class="nav-link">用户中心</a>
                <a href="my-orders.html" class="nav-link active">我的订单</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="order-detail-container">
            <div style="margin-bottom:16px"><a href="my-orders.html" style="color:var(--primary-color);text-decoration:none">← 返回订单列表</a></div>
            <div id="orderContent"><div class="loading">加载中...</div></div>
        </div>
    </main>
</div>

<div id="cancelModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
        <h3>取消订单</h3>
        <p style="font-size:14px;color:var(--text-muted);margin-bottom:12px">请输入取消原因：</p>
        <textarea id="cancelReasonInput" placeholder="请输入取消原因..."></textarea>
        <div class="btn-row">
            <button class="btn btn-secondary" onclick="closeCancelModal()">取消</button>
            <button class="btn btn-primary" onclick="confirmCancel()">确认取消订单</button>
        </div>
    </div>
</div>

<div id="refundModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
        <h3>申请退款</h3>
        <p style="font-size:14px;color:var(--text-muted);margin-bottom:12px">退款金额将原路返回，请填写退款原因：</p>
        <select id="refundTypeSelect">
            <option value="ORDER_CANCEL">不想要了</option>
            <option value="SESSION_CHANGE">演出变更</option>
            <option value="DUPLICATE_ORDER">重复下单</option>
            <option value="OTHER">其他原因</option>
        </select>
        <textarea id="refundReasonInput" placeholder="请详细描述退款原因..."></textarea>
        <div class="btn-row">
            <button class="btn btn-secondary" onclick="closeRefundModal()">取消</button>
            <button class="btn btn-primary" onclick="confirmRefund()">提交退款申请</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    var currentOrder = null;
    var currentTicket = null;

    function getOrderId() {
        var params = new URLSearchParams(window.location.search);
        return params.get('id');
    }

    async function loadOrder() {
        var orderId = getOrderId();
        if (!orderId) { document.getElementById('orderContent').innerHTML = '<p>订单ID不存在</p>'; return; }

        try {
            var res = await api.orders.getDetail(orderId);
            if (res.code === 200) {
                currentOrder = res.data;
                renderOrder(currentOrder);
                loadTicket(orderId);
            } else {
                document.getElementById('orderContent').innerHTML = '<p style="color:var(--error-color)">' + (res.message || '加载失败') + '</p>';
            }
        } catch (e) {
            document.getElementById('orderContent').innerHTML = '<p style="color:var(--error-color)">加载失败</p>';
        }
    }

    async function loadTicket(orderId) {
        try {
            var res = await api.tickets.getByOrderId(orderId);
            if (res.code === 200) {
                currentTicket = res.data;
                renderTicket(currentTicket);
            }
        } catch (e) {}
    }

    function getStatusText(status) {
        var map = {
            'PENDING_PAYMENT': '待支付',
            'PAID': '已支付',
            'CANCELLED': '已取消',
            'REFUNDED': '已退款',
            'REFUNDING': '退款中',
            'PAYMENT_FAILED': '支付失败'
        };
        return map[status] || status;
    }

    function getRefundStatusText(status) {
        var map = { 'REFUNDING': '退款中', 'REFUNDED': '已退款', 'REJECTED': '退款被拒' };
        return map[status] || status || '-';
    }

    function renderOrder(order) {
        var html = '';

        html += '<div class="order-card"><div class="order-card-header">订单信息</div><div class="order-card-body">';
        html += '<div class="info-grid">';
        html += '<div class="info-item"><span class="label">订单号</span><span class="value">' + order.orderId + '</span></div>';
        html += '<div class="info-item"><span class="label">订单状态</span><span class="value"><span class="status-badge status-' + order.orderStatus + '">' + getStatusText(order.orderStatus) + '</span></span></div>';
        html += '<div class="info-item"><span class="label">演出名称</span><span class="value">' + (order.activityName || '-') + '</span></div>';
        html += '<div class="info-item"><span class="label">演出日期</span><span class="value">' + (order.sessionDate || '-') + ' ' + (order.sessionTime || '') + '</span></div>';
        html += '<div class="info-item"><span class="label">场馆</span><span class="value">' + (order.venue || '-') + '</span></div>';
        html += '<div class="info-item"><span class="label">座位信息</span><span class="value">' + (order.seatInfo || '-') + '</span></div>';
        html += '<div class="info-item"><span class="label">总金额</span><span class="value" style="color:var(--error-color);font-size:20px">¥' + (order.totalPrice || 0) + '</span></div>';
        html += '<div class="info-item"><span class="label">支付方式</span><span class="value">' + (order.paymentMethod || '-') + '</span></div>';
        html += '<div class="info-item"><span class="label">创建时间</span><span class="value">' + formatTime(order.createTime) + '</span></div>';
        html += '<div class="info-item"><span class="label">支付时间</span><span class="value">' + formatTime(order.payTime) + '</span></div>';
        if (order.cancelReason) {
            html += '<div class="info-item"><span class="label">取消原因</span><span class="value">' + order.cancelReason + '</span></div>';
            html += '<div class="info-item"><span class="label">取消时间</span><span class="value">' + formatTime(order.cancelTime) + '</span></div>';
        }
        if (order.refundStatus) {
            html += '<div class="info-item"><span class="label">退款状态</span><span class="value">' + getRefundStatusText(order.refundStatus) + '</span></div>';
            if (order.refundTime) {
                html += '<div class="info-item"><span class="label">退款时间</span><span class="value">' + formatTime(order.refundTime) + '</span></div>';
            }
        }
        html += '</div>';

        html += '<div class="action-bar">';
        if (order.orderStatus === 'PENDING_PAYMENT') {
            html += '<button class="btn btn-primary" onclick="payOrder()">立即支付</button>';
            html += '<button class="btn btn-outline" style="color:var(--error-color);border-color:var(--error-color)" onclick="showCancelModal()">取消订单</button>';
        }
        if (order.orderStatus === 'PAID') {
            html += '<button class="btn btn-outline" style="color:var(--error-color);border-color:var(--error-color)" onclick="showCancelModal()">取消订单</button>';
            if (!order.refundStatus || order.refundStatus === 'REJECTED') {
                html += '<button class="btn btn-outline" onclick="showRefundModal()">申请退款</button>';
            }
            html += '<button class="btn btn-primary" onclick="generateTicket()">生成电子票</button>';
        }
        html += '</div>';
        html += '</div></div>';

        html += '<div id="ticketSection"></div>';
        html += '<div id="refundSection"></div>';

        document.getElementById('orderContent').innerHTML = html;
        loadRefundInfo(order.orderId);
    }

    function renderTicket(ticket) {
        if (!ticket) return;
        var section = document.getElementById('ticketSection');
        if (!section) return;

        var html = '<div class="order-card"><div class="order-card-header">🎫 电子票</div><div class="order-card-body">';
        html += '<div class="ticket-card">';
        html += '<div style="font-size:18px;font-weight:700;margin-bottom:8px">' + (ticket.activityName || '') + '</div>';
        html += '<div style="color:var(--text-muted);margin-bottom:12px">' + (ticket.sessionDate || '') + ' ' + (ticket.sessionTime || '') + ' | ' + (ticket.venue || '') + '</div>';
        html += '<div class="ticket-code">' + ticket.ticketCode + '</div>';
        html += '<img class="qr-img" id="qrCodeImg" src="" alt="二维码" style="display:none">';
        html += '<div style="font-size:14px;color:var(--text-muted)">座位: ' + (ticket.seatInfo || '-') + '</div>';
        html += '<div style="font-size:14px;margin-top:4px">状态: ' + ('VALID' === ticket.status ? '✅ 有效' : '✔️ 已使用') + '</div>';
        html += '</div>';
        html += '<div style="text-align:center;margin-top:16px">';
        html += '<button class="btn btn-primary" onclick="downloadPdf(\'' + ticket.orderId + '\')">下载PDF电子票</button>';
        html += '</div>';
        html += '</div></div>';

        section.innerHTML = html;
        loadQrCode(ticket.ticketCode);
    }

    async function loadQrCode(ticketCode) {
        try {
            var token = localStorage.getItem('token');
            var response = await fetch(API_BASE_URL + '/tickets/qrcode/' + ticketCode, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) {
                var blob = await response.blob();
                var url = URL.createObjectURL(blob);
                var img = document.getElementById('qrCodeImg');
                if (img) {
                    img.src = url;
                    img.style.display = 'block';
                }
            }
        } catch (e) {}
    }

    async function downloadPdf(orderId) {
        try {
            var token = localStorage.getItem('token');
            var response = await fetch(API_BASE_URL + '/tickets/pdf/' + orderId, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) {
                var blob = await response.blob();
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'ticket_' + orderId + '.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } else {
                alert('下载PDF失败，请确认电子票已生成');
            }
        } catch (e) {
            alert('下载PDF失败');
        }
    }

    async function loadRefundInfo(orderId) {
        try {
            var res = await api.refunds.getByOrderId(orderId);
            if (res.code === 200 && res.data && res.data.length > 0) {
                var section = document.getElementById('refundSection');
                if (!section) return;
                var html = '<div class="order-card"><div class="order-card-header">💰 退款记录</div><div class="order-card-body">';
                res.data.forEach(function(r) {
                    var statusMap = { 'PENDING': '待审核', 'APPROVED': '已通过', 'REJECTED': '已拒绝', 'COMPLETED': '已完成' };
                    html += '<div style="border-bottom:1px solid var(--border-light);padding:12px 0">';
                    html += '<div style="display:flex;justify-content:space-between"><span>退款单号: ' + r.refundNo + '</span><span class="status-badge status-' + (r.status === 'APPROVED' ? 'REFUNDED' : r.status === 'PENDING' ? 'REFUNDING' : 'CANCELLED') + '">' + (statusMap[r.status] || r.status) + '</span></div>';
                    html += '<div style="margin-top:8px;font-size:13px;color:var(--text-muted)">退款金额: ¥' + r.refundAmount + ' | 原因: ' + (r.refundReason || '-') + '</div>';
                    if (r.auditRemark) html += '<div style="margin-top:4px;font-size:13px;color:var(--text-muted)">审核备注: ' + r.auditRemark + '</div>';
                    html += '</div>';
                });
                html += '</div></div>';
                section.innerHTML = html;
            }
        } catch (e) {}
    }

    async function payOrder() {
        var method = prompt('请输入支付方式（ALIPAY/WECHAT/BANK_CARD）:', 'ALIPAY');
        if (!method) return;
        try {
            var res = await api.orders.pay(currentOrder.orderId, method);
            if (res.code === 200) {
                alert('支付成功！');
                loadOrder();
            } else {
                alert(res.message || '支付失败');
            }
        } catch (e) { alert('支付失败'); }
    }

    function showCancelModal() { document.getElementById('cancelModal').style.display = 'flex'; }
    function closeCancelModal() { document.getElementById('cancelModal').style.display = 'none'; }

    async function confirmCancel() {
        var reason = document.getElementById('cancelReasonInput').value.trim();
        if (!reason) { alert('请输入取消原因'); return; }
        try {
            var res = await api.orders.cancel(currentOrder.orderId, reason);
            if (res.code === 200) {
                closeCancelModal();
                alert('订单已取消');
                loadOrder();
            } else {
                alert(res.message || '取消失败');
            }
        } catch (e) { alert('取消失败'); }
    }

    function showRefundModal() { document.getElementById('refundModal').style.display = 'flex'; }
    function closeRefundModal() { document.getElementById('refundModal').style.display = 'none'; }

    async function confirmRefund() {
        var reason = document.getElementById('refundReasonInput').value.trim();
        var type = document.getElementById('refundTypeSelect').value;
        if (!reason) { alert('请输入退款原因'); return; }
        try {
            var res = await api.refunds.apply(currentOrder.orderId, reason, type);
            if (res.code === 200) {
                closeRefundModal();
                alert('退款申请已提交，请等待审核');
                loadOrder();
            } else {
                alert(res.message || '申请失败');
            }
        } catch (e) { alert('申请失败'); }
    }

    async function generateTicket() {
        try {
            var res = await api.tickets.generate(currentOrder.orderId);
            if (res.code === 200) {
                alert('电子票生成成功！');
                loadTicket(currentOrder.orderId);
            } else {
                alert(res.message || '生成失败');
            }
        } catch (e) { alert('生成失败'); }
    }

    function formatTime(t) {
        if (!t) return '-';
        return t.replace('T', ' ').substring(0, 19);
    }

    document.addEventListener('DOMContentLoaded', function() {
        var token = localStorage.getItem('token');
        if (!token) { window.location.href = 'index.html'; return; }
        loadOrder();
    });
</script>
</body>
</html>
