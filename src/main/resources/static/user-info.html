<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息 - 演唱会管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container{max-width:900px;margin:0 auto;padding:24px}
        .profile-header{background:linear-gradient(135deg,var(--primary-color) 0%,#7c3aed 100%);border-radius:20px;padding:40px;color:#fff;display:flex;align-items:center;gap:24px;margin-bottom:32px;box-shadow:0 10px 40px -10px rgba(99,102,241,.4)}
        .profile-avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:40px;flex-shrink:0;border:3px solid rgba(255,255,255,.4)}
        .profile-header-info h1{margin:0 0 4px;font-size:24px;font-weight:700}
        .profile-header-info p{margin:0;opacity:.85;font-size:14px}
        .profile-card{background:var(--white);border-radius:16px;box-shadow:0 4px 20px -5px rgba(0,0,0,.08);margin-bottom:24px;overflow:hidden}
        .profile-card-title{padding:20px 28px;font-size:17px;font-weight:700;color:#1e293b;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px}
        .profile-card-title .icon{font-size:20px}
        .profile-card-body{padding:24px 28px}
        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        .info-field{display:flex;flex-direction:column;gap:4px}
        .info-field .label{font-size:13px;color:#94a3b8;font-weight:500}
        .info-field .value{font-size:15px;color:#1e293b;font-weight:500}
        .info-field .value.empty{color:#cbd5e1}
        .tag-list{display:flex;flex-wrap:wrap;gap:8px}
        .tag{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600}
        .tag-role{background:linear-gradient(135deg,#6366f1 0%,#7c3aed 100%);color:#fff}
        .tag-perm{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
        .empty-tags{color:#94a3b8;font-size:14px;padding:8px 0}
        .profile-actions{display:flex;gap:12px;margin-top:8px}
    </style>
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">🎫 后台管理</div>
                <div class="nav-links">
                    <a href="admin-home.html" class="nav-link">演唱会管理</a>
                    <a href="admin.html" class="nav-link">添加/编辑演唱会</a>
                    <a href="faq-admin.html" class="nav-link">FAQ 管理</a>
                    <a href="token-usage.html" class="nav-link">Token 用量</a>
                    <a href="role-manage.html" class="nav-link">角色管理</a>
                    <a href="permission-manage.html" class="nav-link">权限管理</a>
                    <a href="user-role-assign.html" class="nav-link">用户角色</a>
                    <a href="role-permission-assign.html" class="nav-link">角色权限</a>
                    <a href="user-info.html" class="nav-link active">👤 个人信息</a>
                    <a href="user-center.html" class="nav-link">🏠 用户中心</a>
                    <a href="operation-log.html" class="nav-link">📋 操作日志</a>
                    <a href="refund-audit.html" class="nav-link">💰 退款审核</a>
                </div>
                <div class="nav-auth">
                    <button class="btn btn-outline" onclick="adminLogout()" style="font-size:13px;padding:6px 16px">退出登录</button>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="profile-container">
                <div id="profileContent"><div class="loading" style="text-align:center;padding:60px">加载中...</div></div>
            </div>
        </main>
    </div>

    <script src="js/auth-check.js"></script>
    <script>
        var API_BASE_URL = '/api/v1';

        function adminLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('permissions');
            localStorage.removeItem('roles');
            window.location.href = 'login.html';
        }

        async function loadUserInfo() {
            var container = document.getElementById('profileContent');
            var token = localStorage.getItem('token');

            if (!token) {
                container.innerHTML = '<div style="text-align:center;padding:60px"><div style="font-size:48px;margin-bottom:20px">⚠️</div><div style="font-size:18px;color:#dc2626">请先登录</div></div>';
                return;
            }

            try {
                var response = await fetch(API_BASE_URL + '/user/info', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                var data = await response.json();
                if (data.code === 200) {
                    renderUserInfo(data.data);
                } else {
                    container.innerHTML = '<div style="text-align:center;padding:60px;color:#dc2626">加载失败：' + (data.message || '未知错误') + '</div>';
                }
            } catch (error) {
                container.innerHTML = '<div style="text-align:center;padding:60px;color:#dc2626">加载失败，请稍后重试</div>';
            }
        }

        function renderUserInfo(userData) {
            var container = document.getElementById('profileContent');
            var user = userData.user;
            var roles = userData.roles || [];
            var permissions = userData.permissions || [];

            var roleNameMap = { 'ADMIN': '管理员', 'OPERATOR': '运营', 'CUSTOMER_SERVICE': '客服', 'NORMAL_USER': '普通用户' };

            var rolesHtml = roles.length > 0
                ? roles.map(function(r) { return '<span class="tag tag-role">' + (roleNameMap[r] || r) + '</span>'; }).join('')
                : '<span class="empty-tags">暂无角色</span>';

            var permGroupHtml = '';
            if (permissions.length > 0) {
                var groups = {};
                permissions.forEach(function(p) {
                    var parts = p.split(':');
                    var module = parts[0] || 'other';
                    if (!groups[module]) groups[module] = [];
                    groups[module].push(p);
                });
                var moduleNames = { 'activity': '活动管理', 'order': '订单管理', 'seat': '座位管理', 'faq': 'FAQ管理', 'refund': '退款管理', 'log': '日志管理', 'user': '用户管理', 'role': '角色管理', 'permission': '权限管理' };
                Object.keys(groups).forEach(function(mod) {
                    permGroupHtml += '<div style="margin-bottom:16px">';
                    permGroupHtml += '<div style="font-size:13px;font-weight:600;color:#64748b;margin-bottom:8px">' + (moduleNames[mod] || mod) + '</div>';
                    permGroupHtml += '<div class="tag-list">';
                    groups[mod].forEach(function(p) {
                        permGroupHtml += '<span class="tag tag-perm">' + p + '</span>';
                    });
                    permGroupHtml += '</div></div>';
                });
            } else {
                permGroupHtml = '<span class="empty-tags">暂无权限</span>';
            }

            var html = '';

            html += '<div class="profile-header">';
            html += '<div class="profile-avatar">👤</div>';
            html += '<div class="profile-header-info">';
            html += '<h1>' + (user.nickname || '未设置昵称') + '</h1>';
            html += '<p>ID: ' + user.id + ' | ' + roles.map(function(r) { return roleNameMap[r] || r; }).join(' · ') + '</p>';
            html += '</div>';
            html += '</div>';

            html += '<div class="profile-card"><div class="profile-card-title"><span class="icon">📋</span> 基本信息</div><div class="profile-card-body">';
            html += '<div class="info-grid">';
            html += '<div class="info-field"><span class="label">用户 ID</span><span class="value">' + (user.id || '-') + '</span></div>';
            html += '<div class="info-field"><span class="label">昵称</span><span class="value">' + (user.nickname || '-') + '</span></div>';
            html += '<div class="info-field"><span class="label">手机号</span><span class="value">' + (user.phone || '-') + '</span></div>';
            html += '<div class="info-field"><span class="label">邮箱</span><span class="value ' + (user.email ? '' : 'empty') + '">' + (user.email || '未绑定') + '</span></div>';
            html += '</div>';
            html += '</div></div>';

            html += '<div class="profile-card"><div class="profile-card-title"><span class="icon">🎭</span> 角色信息</div><div class="profile-card-body">';
            html += '<div class="tag-list">' + rolesHtml + '</div>';
            html += '</div></div>';

            html += '<div class="profile-card"><div class="profile-card-title"><span class="icon">🔐</span> 权限列表 <span style="font-weight:400;font-size:13px;color:#94a3b8;margin-left:8px">共 ' + permissions.length + ' 项</span></div><div class="profile-card-body">';
            html += permGroupHtml;
            html += '</div></div>';

            html += '<div class="profile-actions">';
            html += '<a href="admin-home.html" class="btn btn-outline">返回管理首页</a>';
            html += '</div>';

            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
        });
    </script>
</body>
</html>
